name: Build
on:
  push:
    paths:
      - 'Plain Craft Launcher 2/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'Plain Craft Launcher 2/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: windows-latest
    strategy:  
       matrix:  
         configuration: [Debug, Release]

    steps:

    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 1
        submodules: true

    - name: Set Describe
      shell: bash
      run: |
          describe=`git describe --tags --always`
          echo "describe=$describe" >> $GITHUB_ENV

    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v3
      with:
        msbuild-architecture: x64
    
    - name: Update Help
      run:  |
        Set-Location ..
        git clone https://github.com/LTCatt/PCL2Help.git -b master --single-branch --depth 1
        Set-Location PCL2Help
        Remove-Item -Path *.* -Recurse -Force
        Compress-Archive -Path .\* -DestinationPath .\Help.zip
        Copy-Item -Path .\Help.zip -Destination "${{ GITHUB.WORKSPACE }}\Plain Craft Launcher 2\Resources\Help.zip" -Force
        Set-Location ..
        Remove-Item PCL2Help -Recurse -Force
        Set-Location ${{ GITHUB.WORKSPACE }}


    - name: Replace
      shell: pwsh
      env:
        SEC_CLIENT_ID: ${{ secrets.CLIENT_ID }}
        SEC_CF_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        COMMIT_SHA: ${{ github.sha }}
      run: |
        $secretFile = Resolve-Path "Plain Craft Launcher 2\Modules\ModSecret.vb"
        $content = [System.IO.File]::ReadAllText($secretFile, [System.Text.Encoding]::UTF8)
        if (-not [string]::IsNullOrEmpty($env:SEC_CLIENT_ID)) {
          $target = 'Public OAuthClientId As String = If(Environment.GetEnvironmentVariable("PCL_MS_CLIENT_ID"), "' + $env:SEC_CLIENT_ID + '")'
          $content = [regex]::Replace($content, 'Public OAuthClientId As String = If\(Environment\.GetEnvironmentVariable\("PCL_MS_CLIENT_ID"\), "[^"]*"\)', { param($m) $target })
        }
        if (-not [string]::IsNullOrEmpty($env:SEC_CF_KEY)) {
          $keyBytes = [System.Text.Encoding]::UTF8.GetBytes($env:SEC_CF_KEY)
          $rng = [System.Security.Cryptography.RandomNumberGenerator]::Create()
          $maskBytes = New-Object Byte[] $keyBytes.Length
          $rng.GetBytes($maskBytes)
          $xorBytes = New-Object Byte[] $keyBytes.Length
          for ($i = 0; $i -lt $keyBytes.Length; $i++) {
            $xorBytes[$i] = $keyBytes[$i] -bxor $maskBytes[$i]
          }
          $xorStr = ($xorBytes -join ", ")
          $maskStr = ($maskBytes -join ", ")
          $content = $content.Replace('Private ReadOnly CurseForgeKeyXor As Byte() = {}', "Private ReadOnly CurseForgeKeyXor As Byte() = {$xorStr}")
          $content = $content.Replace('Private ReadOnly CurseForgeKeyMask As Byte() = {}', "Private ReadOnly CurseForgeKeyMask As Byte() = {$maskStr}")
        }
        [System.IO.File]::WriteAllText($secretFile, $content, [System.Text.Encoding]::UTF8)

        $modBaseFile = Resolve-Path "Plain Craft Launcher 2\Modules\Base\ModBase.vb"
        $modBaseContent = [System.IO.File]::ReadAllText($modBaseFile, [System.Text.Encoding]::UTF8)
        $modBaseContent = $modBaseContent.Replace('Public Const CommitHash As String = ""', 'Public Const CommitHash As String = "' + $env:COMMIT_SHA + '"')
        [System.IO.File]::WriteAllText($modBaseFile, $modBaseContent, [System.Text.Encoding]::UTF8)
        
    - name: Restore NuGet Packages
      run: dotnet restore PCLCS\PCLCS.csproj

    - name: Build
      run: msbuild "Plain Craft Launcher 2\Plain Craft Launcher 2.vbproj" -p:Configuration=${{ matrix.configuration }}

    - name: Upload a Build Artifact
      if: false
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.configuration }} ${{ env.describe }}
        path: Plain Craft Launcher 2\obj\${{ matrix.configuration }}\Plain Craft Launcher 2.exe
